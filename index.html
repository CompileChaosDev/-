<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cfe2ff">
  <title>Malix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div id="bg"></div>

  <div id="scrim"></div>
  <aside id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="dr-head">
      <div class="dr-brand">
        <button class="dr-logo" id="logoBtn" type="button" aria-label="Ke beranda"><img id="drawerLogo" alt=""></button>
        <span class="dr-name" id="drName"></span>
      </div>
      <button class="dr-close" id="closeBtn" type="button" aria-label="Tutup menu">&#10005;</button>
    </div>
    <nav class="dr-nav">
      <p class="dr-label">Menu</p>
      <a href="#home" data-nav="home">
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg>Home
      </a>
      <a href="#projects" data-nav="projects">
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h6l2 2h10V19H3z"/><path d="M3 11h18"/></svg>Projects
      </a>
      <a href="#produk" data-nav="produk">
        <svg class="mi" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 4h3l2.2 11h10.6l2-8H6"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Produk
      </a>
    </nav>
    <p class="dr-foot" id="drFoot"></p>
  </aside>

  <main class="app">
    <header class="top">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">&#8942;</button>
    </header>

    <section class="room" id="home">
      <img class="logo" id="logo" alt="">
      <h1 class="home-name" id="homeName" hidden></h1>
      <p class="card" id="desc" hidden></p>
      <nav class="links" id="links"></nav>
    </section>

    <section class="room" id="projects" hidden>
      <h2 class="title">Projects</h2>
      <div class="projects" id="projectList"></div>
    </section>

    <section class="room" id="produk" hidden>
      <h2 class="title">Produk</h2>
      <div class="products" id="productList"></div>
    </section>

    <p class="foot" id="foot"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
